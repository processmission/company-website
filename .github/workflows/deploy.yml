name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy-before: ${{ steps.cache.outputs.deploy-before }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Check source
        run: |
          node src/utils/paths.test.mjs
          node scripts/cache-release.test.mjs
          npm run check
      - name: Check development HTTP caching
        run: |
          trap 'npm run dev -- stop' EXIT
          npm run dev -- --background --host 127.0.0.1 --port 4321
          node src/utils/cache.test.mjs http://127.0.0.1:4321
      - name: Build static pages
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Prepare bounded cache assets
        id: cache
        run: node scripts/cache-release.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Upload static pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse stale prepared artifacts
        env:
          DEPLOY_BEFORE: ${{ needs.build.outputs.deploy-before }}
        run: |
          if [[ ! "$DEPLOY_BEFORE" =~ ^[0-9]+$ ]] || (( ${#DEPLOY_BEFORE} > 12 )); then
            echo "::error::Missing or invalid cache preparation deadline"
            exit 1
          fi
          if (( $(date +%s) >= 10#$DEPLOY_BEFORE )); then
            echo "::error::Prepared cache assets are stale; rebuild before deploying"
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
