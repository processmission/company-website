<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="mfcp-yocto-title mfcp-yocto-description">
  <title id="mfcp-yocto-title">Recipes and layers build a target Linux image</title>
  <desc id="mfcp-yocto-description">A conceptual Yocto build flow: recipes and software layers feed a build that produces an embedded Linux image for a target platform. The diagram represents reproducible image construction as an engineering goal, not a screenshot, an available download or a claim that a particular build has been verified.</desc>
  <defs>
    <linearGradient id="mfcp-yocto-blue" x1="0" y1="0" x2="100%" y2="100%">
      <stop stop-color="#fff"/>
      <stop offset=".75" stop-color="#e8f0f4"/>
    </linearGradient>
    <linearGradient id="mfcp-yocto-warm" x1="0" y1="0" x2="100%" y2="100%">
      <stop stop-color="#fff"/>
      <stop offset=".75" stop-color="#fbf1ec"/>
    </linearGradient>
    <linearGradient id="mfcp-yocto-surface" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset=".2" stop-color="#fff"/>
      <stop offset="1" stop-color="#f2f5f6"/>
    </linearGradient>
    <radialGradient id="mfcp-yocto-light" cx="25%" cy="0%" r="85%">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="mfcp-yocto-panel-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="22" flood-color="#274b61" flood-opacity=".06"/>
    </filter>
    <filter id="mfcp-yocto-surface-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="14" flood-color="#274b61" flood-opacity=".06"/>
      <feDropShadow dx="0" dy="32" stdDeviation="36" flood-color="#274b61" flood-opacity=".08"/>
    </filter>
  </defs>
