<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="devops-title devops-description" style="--fg:#274b61;--muted:#17232b;--border:#cad4d9;--surface:#e8f0f4;--accent:#b64926">
  <title id="devops-title">Versioned development and deployment flow</title>
  <desc id="devops-description">Versioned source and configuration flow to a toolchain build, QEMU, board or HIL validation, and controlled deployment. Records preserve traceability across the flow, while deployment feedback returns to the source baseline. Validation scope depends on the project and target.</desc>
  <defs>
    <linearGradient id="devops-blue" x1="0" y1="0" x2="100%" y2="100%">
      <stop stop-color="#fff"/>
      <stop offset=".75" stop-color="#e8f0f4"/>
    </linearGradient>
    <linearGradient id="devops-warm" x1="0" y1="0" x2="100%" y2="100%">
      <stop stop-color="#fff"/>
      <stop offset=".75" stop-color="#fbf1ec"/>
    </linearGradient>
    <linearGradient id="devops-surface" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset=".2" stop-color="#fff"/>
      <stop offset="1" stop-color="#f2f5f6"/>
    </linearGradient>
    <filter id="devops-panel-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="22" flood-color="#274b61" flood-opacity=".06"/>
    </filter>
  </defs>
  <g font-family="'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <g stroke-width="3" filter="url(#devops-panel-shadow)">
      <rect x="156" y="140" width="500" height="252" rx="20" fill="url(#devops-warm)" stroke="#b64926" stroke-opacity=".3"/>
      <rect x="880" y="140" width="500" height="252" rx="20" fill="url(#devops-blue)" stroke="#a9bec9"/>
      <rect x="880" y="644" width="500" height="252" rx="20" fill="url(#devops-surface)" stroke="#cad4d9"/>
      <rect x="156" y="644" width="500" height="252" rx="20" fill="url(#devops-blue)" stroke="#a9bec9"/>
    </g>
    <path d="M180 144H632M904 144H1356M904 648H1356M180 648H632" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="var(--fg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M656 266H858M840 248L858 266L840 284"/>
      <path d="M1130 392V622M1112 604L1130 622L1148 604"/>
      <path d="M880 770H678M696 752L678 770L696 788"/>
    </g>
    <g fill="var(--surface)" stroke="var(--fg)" stroke-width="5">
      <circle cx="768" cy="266" r="13"/>
      <circle cx="768" cy="770" r="13"/>
    </g>
    <path d="M230 644V416" fill="none" stroke="var(--accent)" stroke-width="6" stroke-dasharray="12 14" stroke-linecap="round"/>
    <path d="M212 434L230 416L248 434" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="var(--muted)" font-size="60" font-weight="500">
      <text x="406" y="215">Source</text>
      <text x="1130" y="215">Build</text>
      <text x="1130" y="719">Validate</text>
      <text x="406" y="719">Deploy</text>
    </g>
    <g fill="var(--fg)" font-size="44" font-weight="400">
      <text x="406" y="283">Code + Config</text>
      <text x="1130" y="283">Toolchain + Artifacts</text>
      <text x="1130" y="787">QEMU / Board / HIL</text>
      <text x="406" y="787">Controlled release</text>
    </g>
    <g fill="var(--fg)" font-size="56" font-weight="500">
      <text x="768" y="499">Versioned</text>
      <text x="768" y="562">traceability</text>
    </g>
    <text x="410" y="539" fill="var(--accent)" font-size="44" font-weight="400">Feedback</text>
    <g fill="none" stroke="var(--fg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
