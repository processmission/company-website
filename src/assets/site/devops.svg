      <rect x="492" y="832" width="48" height="42" rx="5"/>
    </g>
    <g fill="var(--accent)">
      <rect x="1112" y="592" width="36" height="12" rx="3"/>
      <circle cx="292" cy="853" r="5"/>
      <circle cx="404" cy="853" r="5"/>
      <circle cx="516" cy="853" r="5"/>
    </g>
  </g>
</svg>
