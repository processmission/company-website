      <rect x="795" y="488" width="24" height="40" rx="3"/>
      <rect x="835" y="498" width="24" height="30" rx="3"/>
      <rect x="875" y="480" width="24" height="48" rx="3"/>
      <rect x="915" y="498" width="24" height="30" rx="3"/>
    </g>
    <path d="M1109 520H1140V488H1171V520H1202V488H1233V520H1264V488H1295" fill="none" stroke="#274b61" stroke-width="5" stroke-linejoin="round"/>

    <path d="M694 614H1358" stroke="#cad4d9" stroke-width="3"/>
    <path d="M710 668H764L792 696V774H710Z" fill="url(#os-blue)" stroke="#a9bec9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M764 668V696H792M730 728H771M730 749H759" fill="none" stroke="#274b61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="832" y="714" font-size="56" font-weight="500" fill="#17232b">System image</text>
    <text x="832" y="776" font-size="44" font-weight="400" fill="#53616a">Runtime config</text>
  </g>
