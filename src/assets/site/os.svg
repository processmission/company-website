    <rect x="1048" y="316" width="310" height="244" rx="20" fill="url(#os-blue)" stroke="#a9bec9" stroke-width="3" filter="url(#os-panel-shadow)"/>
    <path d="M716 320H982M1070 320H1336" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="3" stroke-linecap="round"/>
