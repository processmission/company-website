    <path d="M674 148H958L1000 194H1380Q1404 194 1404 218V852Q1404 876 1380 876H674Q650 876 650 852V172Q650 148 674 148Z" fill="url(#os-light)"/>
    <path d="M676 152H954L997 198H1378" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="704" y="266" font-size="62" font-weight="500" fill="#17232b">Industry OS</text>

