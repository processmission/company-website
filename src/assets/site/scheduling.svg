    <path d="M488 184H692M998 184H1352M528 336H636M1038 336H1292M573 488H617M1088 488H1132M1178 488H1237" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
    <rect x="700" y="332" width="290" height="52" rx="6" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="10 10"/>
    <g fill="var(--accent)" font-size="44" font-weight="400">
      <text x="845" y="373" text-anchor="middle">Waiting</text>
      <text x="1168" y="451">Interrupt</text>
    </g>
    <g fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
