<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="scheduling-title scheduling-description" style="--fg:#274b61;--muted:#17232b;--border:#cad4d9;--surface:#e8f0f4;--accent:#b64926">
  <title id="scheduling-title">Cross-layer execution and scheduling analysis</title>
  <desc id="scheduling-description">Conceptual aligned timelines distinguish partition availability, Guest execution, task execution, waiting and an interrupt. Runtime observation informs candidate configuration, followed by target timing verification and iteration. The diagram has no numerical scale and makes no latency claim.</desc>
  <defs>
    <linearGradient id="scheduling-surface" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset=".2" stop-color="#fff"/>
      <stop offset="1" stop-color="#f2f5f6"/>
    </linearGradient>
    <radialGradient id="scheduling-light" cx="25%" cy="0%" r="85%">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="scheduling-surface-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="14" flood-color="#274b61" flood-opacity=".06"/>
      <feDropShadow dx="0" dy="32" stdDeviation="36" flood-color="#274b61" flood-opacity=".08"/>
    </filter>
  </defs>
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <rect x="132" y="140" width="1272" height="510" rx="20" fill="url(#scheduling-surface)" stroke="#cad4d9" stroke-width="3" filter="url(#scheduling-surface-shadow)"/>
    <rect x="134" y="142" width="1268" height="506" rx="18" fill="url(#scheduling-light)"/>
    <path d="M156 144H1380" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <g fill="var(--muted)" font-size="56" font-weight="500">
      <text x="164" y="228">Partition</text>
      <text x="164" y="380">Guest</text>
      <text x="164" y="532">Task</text>
    </g>
    <g fill="none" stroke="var(--border)" stroke-width="4">
      <path d="M480 240H1360M480 392H1360M480 544H1360"/>
      <path d="M700 162V566M990 162V566" stroke-dasharray="10 12"/>
    </g>
    <g fill="var(--fg)" fill-opacity=".8">
      <rect x="480" y="180" width="220" height="52" rx="6"/>
      <rect x="990" y="180" width="370" height="52" rx="6"/>
      <rect x="520" y="332" width="124" height="52" rx="6"/>
      <rect x="1030" y="332" width="270" height="52" rx="6"/>
